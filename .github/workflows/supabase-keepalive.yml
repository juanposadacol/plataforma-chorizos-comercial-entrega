name: Supabase Keep Alive

# Consulta de solo lectura contra la RPC pública `get_catalog_prices`.
# Objetivo: mantener actividad legítima en el proyecto Supabase Free y avisar
# si la API REST deja de responder. No escribe, no migra y no usa service_role.
# Es un mecanismo de mejor esfuerzo: Supabase no garantiza que evite la pausa.
#
# Autenticación: la publishable key (`sb_publishable_...`) viaja únicamente en el
# header `apikey`. No se envía como `Authorization: Bearer` porque no es un JWT;
# ese header queda reservado para tokens de sesión de usuario, que aquí no hay.

on:
  schedule:
    # 14:17 UTC = 09:17 America/Bogota (UTC-5, sin horario de verano).
    # Lunes (1), miércoles (3) y sábado (6).
    - cron: "17 14 * * 1,3,6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    # Los cron de GitHub Actions solo corren en la rama predeterminada; este
    # guard impide además un workflow_dispatch lanzado desde otra rama.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Read public catalog (read-only RPC)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          : "${SUPABASE_URL:?Missing SUPABASE_URL}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Missing SUPABASE_PUBLISHABLE_KEY}"

          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "${RESPONSE_FILE}"' EXIT

          # La respuesta se guarda en un archivo temporal y nunca se imprime:
          # contiene el catálogo completo con precios.
          set +e
          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --proto '=https' \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              --retry 3 \
              --retry-delay 10 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 60 \
              --request POST \
              "${SUPABASE_URL%/}/rest/v1/rpc/get_catalog_prices" \
              --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              --header "Content-Type: application/json" \
              --data '{}'
          )"
          CURL_EXIT=$?
          set -e

          if [[ "${CURL_EXIT}" -ne 0 ]]; then
            echo "Supabase check failed: transport error (curl exit ${CURL_EXIT})"
            exit 1
          fi

          if [[ ! "${HTTP_CODE}" =~ ^[0-9]{3}$ ]]; then
            echo "Supabase check failed: no HTTP status received"
            exit 1
          fi

          if [[ "${HTTP_CODE}" -lt 200 || "${HTTP_CODE}" -ge 300 ]]; then
            echo "Supabase check failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "Supabase read-only check succeeded with HTTP ${HTTP_CODE}"
          echo "Checked at UTC: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
